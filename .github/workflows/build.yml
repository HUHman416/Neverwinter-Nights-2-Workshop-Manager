name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-tk libfuse2 xvfb
          python3 -m pip install --user -r requirements-build.txt

      - name: Run unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Build AppImage
        run: ./scripts/build_appimage.sh

      - name: Smoke-test GUI and packaged runtime
        run: |
          PYTHONPATH=src xvfb-run -a python3 tests/gui_smoke.py
          APPIMAGE_EXTRACT_AND_RUN=1 ./release/NWN2-Workshop-Manager-x86_64.AppImage --version
          APPIMAGE_EXTRACT_AND_RUN=1 ./release/NWN2-Workshop-Manager-x86_64.AppImage --check-updates

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: NWN2-Workshop-Manager-x86_64
          path: |
            release/NWN2-Workshop-Manager-x86_64.AppImage
            release/NWN2-Workshop-Manager-x86_64.AppImage.sha256
          if-no-files-found: error

      - name: Publish version release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(PYTHONPATH=src python3 -c 'from nwn2_workshop_manager import VERSION; print(VERSION)')"
          TAG="v${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; leaving its verified assets unchanged."
          else
            gh release create "${TAG}" \
              release/NWN2-Workshop-Manager-x86_64.AppImage \
              release/NWN2-Workshop-Manager-x86_64.AppImage.sha256 \
              --target "${GITHUB_SHA}" \
              --title "NWN2 Workshop Manager ${TAG}" \
              --generate-notes
          fi
