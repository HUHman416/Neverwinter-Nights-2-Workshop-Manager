name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-tk libfuse2
          python3 -m pip install --user -r requirements-build.txt

      - name: Run unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Build AppImage
        run: ./scripts/build_appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: NWN2-Workshop-Manager-x86_64
          path: |
            release/NWN2-Workshop-Manager-x86_64.AppImage
            release/NWN2-Workshop-Manager-x86_64.AppImage.sha256
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/NWN2-Workshop-Manager-x86_64.AppImage \
            release/NWN2-Workshop-Manager-x86_64.AppImage.sha256 \
            --title "NWN2 Workshop Manager ${GITHUB_REF_NAME}" \
            --generate-notes
